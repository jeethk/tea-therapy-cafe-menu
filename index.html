:root{--green:#0B5A4A;--orange:#C36833;--cream:#FAF9F5;--ink:#274C44}

header{padding:20px 14px 10px;text-align:center;position:sticky;top:0;background:rgba(250,249,245,.96);z-index:2}

.name{font-size:15px;font-weight:700}.ta{font-family:"Noto Serif Tamil","Noto Sans Tamil",serif;font-size:12px;margin-top:2px;color:#3d655d}.price{font-size:15px;font-weight:800;color:var(--green);white-space:nowrap}
.note{background:var(--green);color:#fff;border-radius:13px;padding:12px;margin:12px 0;font-size:13px;line-height:1.55}footer{text-align:center;color:var(--green);font-size:11px;padding:18px}
